<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>ATS 확장 설정</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
      body { max-width: 520px; margin: 32px auto; padding: 0 16px; }
      header { display: flex; align-items: center; gap: 10px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: 13px ui-monospace, monospace; border-radius: 6px; border: 1px solid #a1a1aa; }
      button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
      .hint { color: #71717a; font-size: 12px; }
      #result { margin-top: 12px; }
      .ok { color: #059669; } .err { color: #dc2626; }
    </style>
  </head>
  <body>
    <header><img src="icons/icon-48.png" width="32" height="32" alt="" /><h1 style="font-size:18px">ATS 확장 설정</h1></header>
    <p>ATS 앱 설정 창의 "브라우저 확장" 섹션에 있는 <b>연결 토큰</b>을 붙여넣으세요.</p>
    <label>연결 토큰 <input id="token" autocomplete="off" spellcheck="false" /></label>
    <button id="save">저장하고 연결 확인</button>
    <p id="result"></p>
    <p class="hint">미리보기는 ATS 앱이 실행 중이고, 앱의 입력 방식이 "단축키 + 브라우저 실시간 미리보기"일 때만 동작합니다.</p>
    <script src="options.js"></script>
  </body>
</html>
