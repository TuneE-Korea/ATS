[package]
name = "ats"
description = "Auto Translate Server: 입력창 텍스트를 단축키로 번역"
version.workspace = true
edition.workspace = true

[lib]
name = "ats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ats-core = { path = "../crates/ats-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
enigo = "0.6"
arboard = "3"
serde.workspace = true
serde_json.workspace = true
log = "0.4"
async-trait.workspace = true
# 브라우저 확장 연결 토큰 생성
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# API 키 보관: Windows 자격 증명 관리자
keyring = { version = "3", features = ["windows-native"] }
# 활성 창의 프로세스 이름과 제목 조회
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
